name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

# Serialize production releases so overlapping runs never open conflicting
# version-bump PRs against stride-devops.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/auth-backend
  BACKEND_APP_NAME: auth-backend
  RESOURCE_GROUP: rg-auth-prod

jobs:
  # ---------------------------------------------------------------------------
  # Build the backend image and push to GHCR + Aliyun ACR (CalVer + :latest).
  # The Tencent PRIMARY stack is released via GitOps — the final step runs
  # Renovate against stride-devops to open an AUTH_IMAGE_TAG bump PR. The admin
  # dashboard and auth-frontend image are owned by stride-devops.
  # ---------------------------------------------------------------------------
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    environment: production
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout x dependency
        uses: actions/checkout@v4
        with:
          repository: zhaochy1990/x
          path: _x

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Tag push — extract version from tag name (v2026.2.1 → 2026.2.1)
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Manual dispatch — use commit SHA
            VERSION="${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Also publish to Aliyun ACR (China mirror) so the Tencent CVM can pull
      # in-region — GHCR's blob CDN is throttled from mainland China. Host in the
      # ALIYUN_ACR_REGISTRY repo variable; creds in secrets.
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: sources/dev/authentication-go/go.sum

      - name: Vendor backend dependencies
        working-directory: sources/dev/authentication-go
        run: |
          go mod edit -replace github.com/zhaochy1990/x="$GITHUB_WORKSPACE/_x"
          go mod vendor

      - name: Build and push Docker image
        working-directory: sources/dev/authentication-go
        env:
          ACR_IMAGE: ${{ vars.ALIYUN_ACR_REGISTRY }}/stride/auth-backend
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.version.outputs.version }} \
            -t ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version }} \
            -t ${{ env.GHCR_IMAGE }}:latest \
            -t "$ACR_IMAGE":${{ steps.version.outputs.version }} \
            -t "$ACR_IMAGE":latest \
            .
          docker push ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version }}
          docker push ${{ env.GHCR_IMAGE }}:latest
          docker push "$ACR_IMAGE":${{ steps.version.outputs.version }}
          docker push "$ACR_IMAGE":latest

      # Run Renovate against stride-devops right after the images land, so its
      # versions.env AUTH_IMAGE_TAG bump PR opens within seconds.
      # Renovate clones stride-devops, reads its renovate.json, sees the new GHCR
      # tag, and opens the PR there. The frontend is released independently by
      # stride-devops and is intentionally not part of this version.
      # Best effort: a missing token or Renovate hiccup must NOT fail the publish.
      #   RENOVATE_TOKEN  — PAT/App token with contents+pull-requests write on
      #                     zhaochy1990/stride-devops (Renovate opens the PR there).
      #   GHCR_READ_TOKEN — read:packages, to list private GHCR tags (may be the
      #                     same PAT as RENOVATE_TOKEN if it also has that scope).
      # Pin renovate@41 — the last major that both runs on Node 22 and reliably
      # detects our GHCR CalVer tags (43.x needs Node >=24 and, on it, stopped
      # opening bump PRs for the docker deps). Pin Node 22 to match @41's engine.
      - name: Set up Node 22 for Renovate
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Open version-bump PR in stride-devops (Renovate)
        continue-on-error: true
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_HOST_RULES: >-
            [{"hostType":"docker","matchHost":"ghcr.io","username":"zhaochy1990","password":"${{ secrets.GHCR_READ_TOKEN }}"}]
          LOG_LEVEL: info
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo "RENOVATE_TOKEN not set — skipping Renovate run."
            exit 0
          fi
          # GHCR's tag-list API can lag a few seconds behind the push we just
          # made; wait so Renovate reliably sees this release's own new tag.
          sleep 30
          # Retry transient registry/network failures: 3 attempts, 10s apart.
          for attempt in 1 2 3; do
            if npx --yes renovate@41 zhaochy1990/stride-devops; then
              exit 0
            fi
            echo "Renovate attempt ${attempt} failed."
            [ "${attempt}" -lt 3 ] && sleep 10
          done
          echo "Renovate did not succeed after 3 attempts."
          exit 1