info:
  contact: {}
  description: HTTP Basic auth (client_id:client_secret) for the /oauth/* endpoints.
  title: Auth Service API
  version: "1.0"
paths:
  /admin/applications:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_handlers.applicationResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List applications
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: Application to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.createApplicationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
