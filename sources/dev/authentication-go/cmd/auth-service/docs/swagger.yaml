securityDefinitions:
  BasicAuth:
    type: basic
  BearerAuth:
    description: '"Bearer <JWT>" for end-user and admin callers.'
    in: header
    name: Authorization
    type: apiKey
  ClientID:
    description: Application client id for the /api/auth/* endpoints.
    in: header
    name: X-Client-Id
    type: apiKey
swagger: "2.0"
