services:
  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: auth
      MYSQL_USER: auth
      MYSQL_PASSWORD: auth_password
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uauth", "-pauth_password"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth:
    build: .
    command: ["serve"]
    ports:
      - "3001:3000"
    volumes:
      - ./keys:/app/keys:ro
    environment:
      MYSQL_DSN: "mysql://auth:auth_password@mysql:3306/auth"
      REDIS_ADDR: "redis:6379"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "3000"
      JWT_PRIVATE_KEY_PATH: "./keys/private.pem"
      JWT_PUBLIC_KEY_PATH: "./keys/public.pem"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      SWAGGER_ENABLED: "true"
      LOG_LEVEL: "debug"
      LOG_FORMAT: "json"
      # WECHAT_CODE2SESSION_URL overrides the WeChat endpoint (tests only).
      # WeChat mini-program appid/secret are configured per application via
      # the admin API, not via env vars.
      WECHAT_CODE2SESSION_URL: "${WECHAT_CODE2SESSION_URL:-}"
      # SMS login (Tencent Cloud). Omit the TENCENT_SMS_* vars to run without
      # SMS; send then returns sms_not_configured. AUTH_SMS_TEST_MODE fixes the
      # code at 123456 and skips the Tencent call (demos / local dev).
      AUTH_SMS_TEST_MODE: "${AUTH_SMS_TEST_MODE:-false}"
      TENCENT_SMS_SECRET_ID: "${TENCENT_SMS_SECRET_ID:-}"
      TENCENT_SMS_SECRET_KEY: "${TENCENT_SMS_SECRET_KEY:-}"
      TENCENT_SMS_SDK_APP_ID: "${TENCENT_SMS_SDK_APP_ID:-}"
      TENCENT_SMS_SIGN_NAME: "${TENCENT_SMS_SIGN_NAME:-}"
      TENCENT_SMS_TEMPLATE_ID: "${TENCENT_SMS_TEMPLATE_ID:-}"
      TENCENT_SMS_REGION: "${TENCENT_SMS_REGION:-ap-guangzhou}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
