# auth-service configuration.
#
# This file is the source of truth: every key below maps 1:1 to the
# environment variable that overrides it (the tag value uppercased, e.g.
# `mysql_dsn` <- MYSQL_DSN, `tencent_sms_secret_key` <- TENCENT_SMS_SECRET_KEY).
# Env overrides only apply to keys present in this file — viper checks the env
# per config key and does not discover env-only vars.
#
# The file is baked into the Docker image at /etc/viper.yml (the loader's
# default path). Deployments mount their own copy or point at it with
# CONFIG_PATH / --config, and override secrets via environment variables.

# --- MySQL (only storage backend; DSN is required) ---
# Accepts URL style (mysql://user:pass@host:3306/db) and Go driver style DSNs.
mysql_dsn: "mysql://auth:auth_password@127.0.0.1:3306/auth"
mysql_tls_ca_pem: ""
mysql_tls_ca_path: ""

# --- JWT signing keys and token lifetimes ---
jwt_private_key_path: "keys/private.pem"
jwt_public_key_path: "keys/public.pem"
jwt_issuer: "auth-service"
jwt_access_token_expiry_secs: 3600
jwt_refresh_token_expiry_days: 30

# --- HTTP server ---
server_host: "127.0.0.1"
server_port: 3000
cors_allowed_origins: "http://localhost:5173,http://localhost:3000"

# --- Features ---
# auth_* keys keep the historical AUTH_* env var names.
auth_enable_test_providers: false
swagger_enabled: false
auth_sms_test_mode: false
# Registration invite gate. New env override: REQUIRE_INVITE_CODE.
require_invite_code: false

# --- Third-party watch OAuth2 account linking ---
# This service's externally reachable base URL, used to build the OAuth2
# callback URL (oauth_public_base_url + /oauth/link/<provider>/callback).
# Never derived from the request Host.
oauth_public_base_url: ""
# Service-wide master switch for mock mode. Mocking happens only when this AND
# the application's provider config mock flag are both true.
oauth_mock_enabled: false

# --- WeChat mini-program ---
# Overrides the public jscode2session endpoint (tests only). Appid/secret are
# configured per application via the admin API, not here.
wechat_code2session_url: ""

# --- Redis (SMS verification codes) ---
redis_addr: "127.0.0.1:6379"
redis_password: ""
redis_db: 0

# --- Tencent Cloud SMS ---
# Empty values don't block startup; /api/auth/sms/send returns
# sms_not_configured until configured.
tencent_sms_secret_id: ""
tencent_sms_secret_key: ""
tencent_sms_sdk_app_id: "1401177585"
tencent_sms_sign_name: "上海砺跑科技"
tencent_sms_template_id: "2716979"
tencent_sms_region: "ap-beijing"

# Per-IP hourly request caps for the SMS send / verify endpoints. The send cap
# also absorbs cooldown-rejected taps (the limiter runs before the per-phone
# checks), and a shared office NAT egress counts as one key.
sms_send_rate_limit: 30
sms_verify_rate_limit: 60

# Per-phone SMS send caps. sms_daily_max bounds verification-code sends per
# phone per 24 h; sms_send_window_max bounds them per phone within one
# 60-second window. Non-positive values fall back to the store defaults (20 / 5).
sms_daily_max: 20
sms_send_window_max: 5

# --- Tencent Cloud COS (user avatars) ---
# Empty values don't block startup; POST /api/users/me/avatar returns
# cos_not_configured until configured. base_url is the public/CDN endpoint
# used to build the returned avatar_url (COS box endpoint now, CDN later).
tencent_cos_secret_id: ""
tencent_cos_secret_key: ""
tencent_cos_bucket: "stride-running-1255867366"
tencent_cos_region: "ap-shanghai"
tencent_cos_base_url: "https://stride-running-1255867366.cos.ap-shanghai.myqcloud.com"

# --- Logging ---
# log_level: debug|info|warning|error (empty falls back to debug)
# log_format: "json" (structured, for log aggregation) or "console"
#             (human-readable). Unset/absent falls back to "console".
log_level: "debug"
log_format: "console"

# --- Version reported by /health and admin stats ---
app_version: "dev"
